name: A workflow for my App

on:
  push:

jobs:
  UnitTests:
    name: Run Unit Tests
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Run Unit Tests
        run: mvn -Dtest=com.napier.sem.AppTest test

  IntegrationTests:
    name: Run Integration Tests
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Start Database for Integration Tests
        run: |
          docker build -t database ./db
          docker run --name worlddb -dp 33060:3306 database
          sleep 20

      - name: Run Integration Tests
        run: mvn -Dtest=com.napier.sem.AppIntegrationTest test

      - name: Stop Database
        run: |
          docker stop worlddb
          docker rm worlddb
          docker image rm database

  Build:
    name: Build App with Docker Compose
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Package
        run: mvn package -DskipTests

      - name: Run Docker Compose
        run: docker compose up --abort-on-container-exit

