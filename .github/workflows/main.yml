name: Java CI - Unit & Integration Tests

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ main, master ]
jobs:
  build-test:
    runs-on: ubuntu-latest

    # Define the database service required for Integration Tests
    services:
      db:
        # Use the base image from your custom db/Dockerfile for consistency
        image: mysql/mysql-server:latest
        # Set environment variables for initialization as per db/Dockerfile
        env:
          MYSQL_ROOT_PASSWORD: example
          # The custom Dockerfile contains the Mac Fix to allow external connections
          MYSQL_ROOT_HOST: "%"
        # Map the container port to the host port 3306.
        # This allows WorldIT.java (which looks for 127.0.0.1:3306) to connect.
        ports:
          - 3306:3306
        # Mount the db folder so the entrypoint finds and loads world.sql
        volumes:
          - ./db:/docker-entrypoint-initdb.d
        # Use a health check to wait until the database is ready, including schema loading
        options: >
          --health-cmd "mysql -h 127.0.0.1 -uroot -pexample -e 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn -B clean package --file pom.xml

      - name: Run Unit Tests
        # The 'test' phase runs only unit tests
        run: mvn -B test --file pom.xml

      - name: Run Integration Tests
        # The 'verify' phase runs the integration tests (WorldIT.java)
        run: mvn -B verify --file pom.xml